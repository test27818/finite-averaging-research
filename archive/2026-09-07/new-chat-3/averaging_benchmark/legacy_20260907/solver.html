<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平均到全等 · 求解器</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --border:#2a313c; --text:#e6edf3; --muted:#8b949e;
    --accent:#3fb950; --accent2:#58a6ff; --warn:#d29922; --bad:#f85149; --bar:#4d5b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  h1 .tag{font-size:12px;font-weight:600;color:var(--accent2);border:1px solid var(--accent2);
          padding:2px 8px;border-radius:20px;vertical-align:middle;margin-left:8px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .panel h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{background:#0d1117;border:1px solid var(--border);color:var(--text);
               border-radius:8px;padding:8px 10px;width:96px;font-size:14px}
  button{background:#1f6feb;color:#fff;border:none;border-radius:8px;padding:9px 14px;
         font-size:14px;cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(1.15)}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  button.ghost:hover{border-color:var(--muted)}
  button:disabled{opacity:.4;cursor:not-allowed}
  /* status */
  .status{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .badge{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--border)}
  .badge.ok{color:var(--accent);border-color:var(--accent)}
  .badge.no{color:var(--bad);border-color:var(--bad)}
  .badge.info{color:var(--accent2);border-color:var(--accent2)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--text);font-weight:600}
  /* viz */
  .stage{position:relative;height:220px;display:flex;align-items:flex-end;gap:8px;padding:0 4px;margin:6px 0 0}
  .col{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
  .bar{position:absolute;bottom:0;left:12%;right:12%;background:var(--bar);border-radius:5px 5px 0 0;
       transition:height .5s cubic-bezier(.4,0,.2,1),background .3s}
  .bar.hot{background:var(--accent2)}
  .bar.done{background:var(--accent)}
  .val{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:var(--text);
       pointer-events:none;transition:bottom .5s cubic-bezier(.4,0,.2,1);white-space:nowrap}
  .meanline{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);opacity:.85;transition:bottom .4s}
  .meanlabel{position:absolute;right:4px;font-size:11px;color:var(--warn);transform:translateY(-16px)}
  .idxrow{display:flex;gap:8px;padding:4px 4px 0}
  .idx{flex:1;text-align:center;font-size:11px;color:var(--muted)}
  /* log */
  .log{max-height:180px;overflow:auto;font-size:13px}
  .log div{padding:3px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
  .log div.cur{background:#1c2735;color:var(--text)}
  .log div:hover{background:#1c2735}
  .play{display:flex;gap:8px;margin-top:10px}
  footer{color:var(--muted);font-size:12px;margin-top:8px}
  code{background:#0d1117;border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>平均到全等 <span class="tag">求解器</span></h1>
  <p class="sub">每次操作取两个数 $x,y$，把它们都替换成 $\frac{x+y}{2}$；求解能否经有限步让所有数等于均值 $A$，并逐步演示。判定用已知充要条件：$n\ge4$ 时可平均 ⟺ $G$（归一化偏差两两差之 gcd）是 2 的幂。</p>

  <div class="panel">
    <h2>实例参数</h2>
    <div class="controls">
      <div class="field">
        <label>数字个数 n</label>
        <input id="nInput" type="number" min="2" max="16" value="5">
      </div>
      <div class="field">
        <label>数值范围 ±max</label>
        <input id="maxInput" type="number" min="1" max="999" value="9">
      </div>
      <button id="btnScramble">随机打乱</button>
      <button id="btnMixable" class="ghost">生成可平均实例</button>
      <button id="btnSolve">求解</button>
      <button id="btnReset" class="ghost" disabled>重置</button>
    </div>
  </div>

  <div class="panel">
    <h2>判定与求解状态</h2>
    <div class="status" id="status">
      <span class="badge info">等待生成实例</span>
    </div>
  </div>

  <div class="panel">
    <h2>求解过程</h2>
    <div class="stage" id="stage"></div>
    <div class="idxrow" id="idxrow"></div>
    <div class="play">
      <button id="btnPlay" disabled>▶ 播放</button>
      <button id="btnPrev" disabled>上一步</button>
      <button id="btnNext" disabled>下一步</button>
    </div>
    <div class="log" id="log" style="margin-top:12px"></div>
  </div>

  <footer>最少步数在一般情形下是开放问题（无多项式算法、未证 NP-hard）；本页对 n≤7 用精确 BFS 求最优，对 n=2<sup>k</sup> 用递归树构造，其余用启发式搜索。所有计算均为精确有理数。</footer>
</div>

<script>
"use strict";
/* ===================== 求解核心（精确有理数 / BigInt） ===================== */
function gcdBig(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b];}return a;}
function dyReduce(n,e){while(n!==0n&&e>0&&n%2n===0n){n/=2n;e--;}if(n===0n)e=0;return{n,e};}
function dyAvg(a,b){const em=Math.max(a.e,b.e);const an=a.n<<BigInt(em-a.e);const bn=b.n<<BigInt(em-b.e);return dyReduce(an+bn,em+1);}
function dyCmp(a,b){const em=Math.max(a.e,b.e);const an=a.n<<BigInt(em-a.e);const bn=b.n<<BigInt(em-b.e);return an===bn?0:(an<bn?-1:1);}
function dyEqToRatio(d,S,n){return d.n*BigInt(n)===S*(1n<<BigInt(d.e));}
function dyToFloat(d){return Number(d.n)/Math.pow(2,d.e);}
function judge(arr){const n=arr.length;if(n<=2)return true;let S=0n;for(const x of arr)S+=x;
  if(n===3){const b=arr.map(x=>BigInt(x)).sort((x,y)=>x<y?-1:(x>y?1:0));return 2n*b[1]===b[0]+b[2];}
  const dev=arr.map(x=>BigInt(n)*x-S);let g=0n;for(const d of dev)g=gcdBig(g,d);if(g===0n)return true;
  const e=dev.map(d=>d/g);let G=0n;for(let i=1;i<n;i++)G=gcdBig(G,e[i]-e[0]);return G>0n&&(G&(G-1n))===0n;}
function bfsSolve(arr,budget){budget=budget||250000;const n=arr.length;const S=arr.reduce((s,x)=>s+x,0n);
  const start=arr.map(x=>({n:x,e:0}));
  const isT=(st)=>{if(!dyEqToRatio(st[0],S,n))return false;for(let i=1;i<n;i++)if(dyCmp(st[i],st[0])!==0)return false;return true;};
  if(isT(start))return{steps:[],minSteps:0};
  const key=(st)=>st.map(d=>d.n+'/'+d.e).sort().join(',');
  const seen=new Set([key(start)]);const parent=new Map();let frontier=[start];let depth=0;
  while(frontier.length){depth++;const next=[];
    for(const st of frontier){const sk=key(st);
      for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const avg=dyAvg(st[i],st[j]);const ns=st.slice();ns[i]=avg;ns[j]=avg;
        const k=key(ns);if(seen.has(k))continue;seen.add(k);parent.set(k,[sk,i,j]);
        if(seen.size>budget)return null;
        if(isT(ns)){const steps=[];let cur=k;while(cur!==key(start)){const[pk,i,j]=parent.get(cur);steps.push([i+1,j+1]);cur=pk;}steps.reverse();return{steps,minSteps:depth};}
        next.push(ns);}}
    frontier=next;}
  return null;}
function power2Tree(n){if(n&(n-1))return null;const steps=[];
  (function rec(lo,hi){if(hi-lo===1)return;if(hi-lo===2){steps.push([lo+1,hi]);return;}const mid=(lo+hi)>>1;rec(lo,mid);rec(mid,hi);for(let k=0;k<mid-lo;k++)steps.push([lo+k+1,mid+k+1]);})(0,n);return steps;}
function greedySolve(arr,restarts,maxSteps){restarts=restarts||80;maxSteps=maxSteps||100;const n=arr.length;const S=arr.reduce((s,x)=>s+x,0n);
  const start=arr.map(x=>({n:x,e:0}));
  const isDone=(st)=>{for(let i=1;i<n;i++)if(dyCmp(st[i],st[0])!==0)return false;return dyEqToRatio(st[0],S,n);};
  let seed=987654321;const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296;};
  for(let r=0;r<restarts;r++){let st=start.slice();const steps=[];
    for(let t=0;t<maxSteps;t++){let imin=0,imax=0;for(let k=1;k<n;k++){if(dyCmp(st[k],st[imin])<0)imin=k;if(dyCmp(st[k],st[imax])>0)imax=k;}
      let i,j;if(rnd()<0.15){i=Math.floor(rnd()*n);j=Math.floor(rnd()*n);if(i===j)j=(j+1)%n;}else{i=imin;j=imax;}
      if(i>j)[i,j]=[j,i];const avg=dyAvg(st[i],st[j]);st=st.slice();st[i]=avg;st[j]=avg;steps.push([i+1,j+1]);
      if(isDone(st))return{steps,minSteps:null};}}
  return null;}
function solve(arr){const n=arr.length;const big=arr.map(x=>BigInt(x));if(!judge(big))return{ok:false,steps:null,minSteps:null,method:'criterion'};
  const maxAbs=Math.max(...arr.map(x=>Math.abs(Number(x))));
  if(n===1)return{ok:true,steps:[],minSteps:0,method:'trivial'};
  if(n===2)return{ok:true,steps:[[1,2]],minSteps:1,method:'trivial'};
  if(n===3){const b=arr.map((v,i)=>[v,i]).sort((x,y)=>(x[0]<y[0]?-1:x[0]>y[0]?1:0));return{ok:true,steps:[[b[0][1]+1,b[2][1]+1]],minSteps:1,method:'arithmetic-progression'};}
  if(n<=7&&maxAbs<=80){const r=bfsSolve(big);if(r)return{ok:true,steps:r.steps,minSteps:r.minSteps,method:'bfs-exact'};}
  if(power2Tree(n))return{ok:true,steps:power2Tree(n),minSteps:null,method:'power2-tree'};
  const g=greedySolve(big);if(g)return{ok:true,steps:g.steps,minSteps:null,method:'greedy'};
  return{ok:true,steps:null,minSteps:null,method:'criterion-only'};}

/* ===================== UI ===================== */
const $=id=>document.getElementById(id);
const nInput=$('nInput'), maxInput=$('maxInput'), stage=$('stage'), idxrow=$('idxrow'), log=$('log');
let arr=[];            // BigInt 数组（当前实例）
let history=[];        // 各步状态（Dyadic 数组）
let steps=[];          // 1-based 操作对
let cur=0; let playing=false; let timer=null;

function randArr(n,max){const a=[];for(let i=0;i<n;i++){const v=Math.floor(Math.random()*(2*max+1))-max;a.push(BigInt(v));}return a;}
function genMixable(n,max){for(let t=0;t<400;t++){const a=randArr(n,max);if(judge(a))return a;}
  const M=BigInt(Math.floor(Math.random()*21)-10);const out=new Array(n);let i=0;
  for(;i+1<n;i+=2){const r=BigInt(1+Math.floor(Math.random()*Math.max(1,max)));out[i]=M-r;out[i+1]=M+r;}
  if(i<n)out[i]=M;return out;}

function fmt(d){if(d.e===0)return d.n.toString();const den=Math.pow(2,d.e);return d.n+"/"+den;}
function fmtMean(){const S=arr.reduce((s,x)=>s+x,0n);const g=gcdBig(S<0n?-S:S,BigInt(arr.length));const num=S/g,den=BigInt(arr.length)/g;return den===1n?num.toString():num+"/"+den;}

function buildHistory(){history=[];let st=arr.map(x=>({n:x,e:0}));history.push(st);
  for(const[i,j]of steps){st=st.slice();const a=dyAvg(st[i-1],st[j-1]);st[i-1]=a;st[j-1]=a;history.push(st);}}

function render(){
  const st=history[cur]||history[0];
  const floats=st.map(dyToFloat);
  const initFloats=(history[0]||st).map(dyToFloat);
  const mean=arr.reduce((s,x)=>s+Number(x),0)/arr.length;
  let vmin=Math.min(...initFloats), vmax=Math.max(...initFloats);
  if(vmin===vmax){vmin=mean-1;vmax=mean+1;}
  const H=180;
  const h=v=>(v-vmin)/(vmax-vmin)*H;
  // bars
  stage.innerHTML='';idxrow.innerHTML='';
  const hot=(cur<steps.length)?steps[cur]:null;
  const solved=cur>=steps.length&&steps.length>0;
  for(let i=0;i<st.length;i++){
    const col=document.createElement('div');col.className='col';
    const bar=document.createElement('div');bar.className='bar';
    if(hot&&(i===hot[0]-1||i===hot[1]-1))bar.classList.add('hot');
    else if(solved)bar.classList.add('done');
    bar.style.height=Math.max(1,h(floats[i]))+'px';
    const val=document.createElement('div');val.className='val';
    val.textContent=fmt(st[i]);val.style.bottom=(Math.max(1,h(floats[i]))+3)+'px';
    col.appendChild(bar);col.appendChild(val);stage.appendChild(col);
    const idx=document.createElement('div');idx.className='idx';idx.textContent=i+1;idxrow.appendChild(idx);
  }
  // mean line
  const ml=document.createElement('div');ml.className='meanline';ml.style.bottom=h(mean)+'px';
  const lab=document.createElement('span');lab.className='meanlabel';lab.textContent='A='+fmtMean();ml.appendChild(lab);
  stage.appendChild(ml);
  renderLog();
}

function renderLog(){
  log.innerHTML='';
  if(steps.length===0){log.innerHTML='<div class="cur">无需操作：已经全等于均值。</div>';return;}
  steps.forEach((s,k)=>{
    const d=document.createElement('div');
    d.textContent='第 '+(k+1)+' 步：平均 (#'+s[0]+', #'+s[1]+')';
    if(k===cur)d.classList.add('cur');
    d.onclick=()=>{cur=k;render();};
    log.appendChild(d);
  });
  log.scrollTop=cur*22;
}

function setStatus(badges){const el=$('status');el.innerHTML='';badges.forEach(b=>{const s=document.createElement('span');s.className='badge '+b.c; s.textContent=b.t; el.appendChild(s);});}

function doSolve(){
  stopPlay();
  const res=solve(arr);
  if(!res.ok){
    steps=[];history=[arr.map(x=>({n:x,e:0}))];cur=0;
    setStatus([{t:'不可平均',c:'no'},{t:'不存在有限步解到均值',c:'info'}]);
  } else if(res.steps){
    steps=res.steps;buildHistory();cur=0;
    const badges=[{t:'可平均',c:'ok'},{t:'方法：'+methodName(res.method),c:'info'}];
    if(res.minSteps!=null)badges.push({t:'最少步数 = '+res.minSteps,c:'ok'});
    else badges.push({t:'步数 = '+steps.length+'（非最优）',c:'warn'});
    setStatus(badges);
  } else {
    steps=[];history=[arr.map(x=>({n:x,e:0}))];cur=0;
    setStatus([{t:'可平均',c:'ok'},{t:'未找到演示序列（'+methodName(res.method)+'）',c:'warn'}]);
  }
  updateButtons();render();
}
function methodName(m){return{ 'trivial':'平凡','arithmetic-progression':'等差','bfs-exact':'精确 BFS','power2-tree':'幂2递归树','greedy':'启发式搜索','criterion-only':'仅判定','criterion':'判定'}[m]||m;}

function updateButtons(){
  const has=steps.length>0;
  $('btnPlay').disabled=!has||cur>=steps.length;
  $('btnNext').disabled=!has||cur>=steps.length;
  $('btnPrev').disabled=!has||cur<=0;
  $('btnReset').disabled=!has;
}

function nextStep(){if(cur<steps.length){cur++;render();updateButtons();}}
function prevStep(){if(cur>0){cur--;render();updateButtons();}}
function resetView(){cur=0;stopPlay();render();updateButtons();}
function play(){if(!steps.length)return;if(playing)return stopPlay();playing=true;$('btnPlay').textContent='⏸ 暂停';timer=setInterval(()=>{if(cur>=steps.length){stopPlay();return;}nextStep();},650);}
function stopPlay(){playing=false;if(timer){clearInterval(timer);timer=null;}$('btnPlay').textContent='▶ 播放';}

$('btnScramble').onclick=()=>{const n=clamp(nInput.value|0,2,16),mx=clamp(maxInput.value|0,1,999);arr=randArr(n,mx);doSolve();};
$('btnMixable').onclick=()=>{const n=clamp(nInput.value|0,2,16),mx=clamp(maxInput.value|0,1,999);arr=genMixable(n,mx);doSolve();};
$('btnSolve').onclick=doSolve;
$('btnReset').onclick=resetView;
$('btnPlay').onclick=play;
$('btnNext').onclick=nextStep;
$('btnPrev').onclick=prevStep;
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// 初始：生成一个可平均实例并求解
arr=genMixable(5,9);doSolve();
</script>
</body>
</html>
